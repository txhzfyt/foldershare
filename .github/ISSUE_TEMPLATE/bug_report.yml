name: Bug report
description: Report a problem with FolderShare
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include private file contents.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.2
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: FolderShare version
      placeholder: e.g. 1.11.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Error text / diagnostics
      description: Paste visible error text or the tunnel diagnostic shown by the app.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I agree to keep this issue public (remove sensitive information).
          required: true
